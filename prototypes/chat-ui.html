<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luqi-ai — Chat</title>
<!--
  Luqi-ai chat console v1.5.0 — 2026-09-24 (brand form: capital L, lowercase rest; UI-3 dynamic engine badge; UI-4 showcase cards)
  Enhanced from the founder's "Ubuntu-Powered Intelligence" mock.

  HOUSE LAW COMPLIANCE
  - Anti-hallucination: no fabricated stats, no fake citations, no fake badges.
    Every panel renders a REAL engine response, a clearly-labelled recorded
    example, or an honest empty/offline state. Nothing is simulated.
  - Response contracts rendered verbatim from the engine:
      POST /v1/finlit/scam-check   (scam_shield)
      POST /v1/deep-research       (deep_research, KNOWLEDGE_GAP_POLICY v1.0.0)
      POST /v1/hybrid/process      (standard front door, guided escalation)
      POST /v1/auth/register       (Companion: create account, then login)
      POST /v1/auth/login          (Companion: JWT access_token, sessionStorage)
      POST /v1/auth/logout         (Companion: Bearer, best-effort)
      POST /v1/companion/chat      (Companion: Bearer, {mode, message, topic?})
  - No stubs: every control on this page does what it claims, or is absent.
  - Design tokens identical to luqi-ai.com (no Tailwind CDN — pure CSS,
    light and fast for low-bandwidth African realities).
-->
<style>
  :root{
    --bg:#faf7f2; --surface:#ffffff; --surface-alt:#f3eee5; --line:#e6dfd4;
    --ink:#2b2620; --soft:#5c554b; --muted:#7a7166;
    --accent:#b4562f; --accent-soft:#f0e2d8;
    --olive:#7a7a52; --olive-deep:#5c6138; --olive-soft:#e6e8d8;
    --r-none:#4a7c59; --r-low:#7a7a52; --r-medium:#a67c1a; --r-high:#b4562f; --r-critical:#9c2b1e;
    --radius:14px; --shadow:0 1px 2px rgba(43,38,32,.06),0 8px 24px rgba(43,38,32,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       font-size:15px;line-height:1.55}
  h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
  a{color:var(--accent)}
  /* ── header ─────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:20;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
              display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:19px}
  .brand-name{font-family:Georgia,serif;font-size:18px;font-weight:700;letter-spacing:.2px}
  .brand-name small{display:block;font-family:-apple-system,sans-serif;font-size:10.5px;color:var(--muted);font-weight:400}
  .pill{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
  .pill.online{border-color:var(--olive);color:var(--olive-deep);background:var(--olive-soft)}
  .pill.offline{border-color:var(--r-critical);color:var(--r-critical);background:#faf0ee}
  .pill.warn{border-color:var(--r-medium);color:var(--r-medium);background:#faf5e8}
  .modes{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .mode-btn{border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:999px;
            padding:6px 14px;font-size:12.5px;cursor:pointer;transition:all .15s}
  .mode-btn:hover{border-color:var(--accent);color:var(--accent)}
  .mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  select.langsel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;
                 font-size:12.5px;color:var(--soft)}
  /* ── ubuntu banner ──────────────────────────────────── */
  .ubuntu{background:var(--olive-soft);border-bottom:1px solid var(--line);padding:10px 20px;
          text-align:center;font-size:13px;color:var(--olive-deep)}
  .ubuntu em{font-family:Georgia,serif}
  /* ── layout ─────────────────────────────────────────── */
  main{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;
       grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
  @media (max-width:940px){main{grid-template-columns:1fr}}
  /* ── chat stream ────────────────────────────────────── */
  .msg{display:flex;margin-bottom:18px}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:82%;padding:13px 16px;border-radius:var(--radius);box-shadow:var(--shadow)}
  .msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:100%;width:100%}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       padding:2px 9px;border-radius:999px;margin-bottom:8px}
  .tag.example{background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent)}
  .tag.live{background:var(--olive-soft);color:var(--olive-deep)}
  .tag.honest{background:#faf0ee;color:var(--r-critical);border:1px solid var(--r-critical)}
  .verdict-band{border-radius:10px;padding:12px 14px;color:#fff;margin:10px 0}
  .verdict-band .band{font-family:Georgia,serif;font-size:17px;font-weight:700;text-transform:capitalize}
  .verdict-band .score{float:right;font-size:12.5px;opacity:.92;padding-top:3px}
  .vb-none{background:var(--r-none)} .vb-low{background:var(--r-low)} .vb-medium{background:var(--r-medium)}
  .vb-high{background:var(--r-high)} .vb-critical{background:var(--r-critical)}
  .verif-banner{border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;margin:10px 0}
  .verif-banner.verified{background:var(--olive-soft);color:var(--olive-deep);border:1px solid var(--olive)}
  .verif-banner.unverified{background:#faf0ee;color:var(--r-critical);border:1px solid var(--r-critical)}
  .panel-h{font-family:Georgia,serif;font-size:14px;font-weight:700;margin:16px 0 7px;color:var(--soft)}
  ul.tight{padding-left:19px} ul.tight li{margin-bottom:5px}
  details.pattern{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--bg)}
  details.pattern summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13.5px;list-style:none}
  details.pattern summary::before{content:"▸ ";color:var(--accent)}
  details.pattern[open] summary::before{content:"▾ "}
  details.pattern .body{padding:0 12px 11px;font-size:13px;color:var(--soft)}
  .kv{font-size:12px;color:var(--muted);margin-top:4px}
  .cite{display:block;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;
        background:var(--bg);text-decoration:none;color:var(--ink)}
  .cite:hover{border-color:var(--accent)}
  .cite .t{font-weight:600;font-size:13.5px}
  .cite .m{font-size:12px;color:var(--muted)}
  .cite.nolink{cursor:default;border-style:dashed}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .escalate{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:12px}
  .escalate button{margin-top:9px}
  button.action{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 16px;
                font-size:13px;font-weight:600;cursor:pointer}
  button.action:hover{filter:brightness(1.07)}
  /* ── chips + composer ───────────────────────────────── */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;
        font-size:12.5px;color:var(--soft);cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  /* ── UI-4 showcase: media banner + capability demo cards ── */
  .showcase{margin:0 0 18px}
  .media-banner{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
                box-shadow:var(--shadow);background:var(--surface-alt);margin-bottom:14px;display:none}
  .media-banner.show{display:block}
  .media-banner video,.medi</parameter>
</invoke>
