<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUQI AI — Coming Soon</title>
<meta name="description" content="LUQI AI — an intelligence platform being built for South Africa. Launching soon.">
<style>
  :root {
    --bg: #faf7f2;
    --ink: #2b2620;
    --muted: #7a7166;
    --accent: #b4562f;
    --line: #e6dfd4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main { max-width: 560px; text-align: center; }
  .mark {
    font-size: 4rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    color: var(--accent);
    line-height: 1;
  }
  h1 { font-size: 1.6rem; margin: 1.2rem 0 0.8rem; font-weight: normal; }
  p { color: var(--muted); line-height: 1.7; font-size: 1.05rem; }
  hr { border: none; border-top: 1px solid var(--line); margin: 2rem auto; width: 60px; }
  .status {
    display: inline-block;
    margin-top: 1.4rem;
    padding: 0.4rem 1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--muted);
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<main>
  <div class="mark">L</div>
  <h1>LUQI AI</h1>
  <p>An intelligence platform built for South Africa — practical help with
     finance, education, government services, and everyday problem-solving.</p>
  <hr>
  <p>We are putting the finishing touches on the platform.<br>
     Please check back soon.</p>
  <span class="status">status: preparing for launch</span>
</main>
</body>
</html>
